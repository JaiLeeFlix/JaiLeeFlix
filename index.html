<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAILEEFLIX - Ultimate Streaming Application</title>
<style>
body {
background-color: #141414;
color: white;
font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
margin: 0;
padding: 20px;
}
.header {
text-align: center;
padding: 20px 0;
}
.logo {
color: #E50914;
font-size: 3.5rem;
font-weight: bold;
letter-spacing: 2px;
margin: 0;
text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
}
.tagline {
color: #aaa;
font-size: 0.9rem;
margin-top: 5px;
}
.search-box {
text-align: center;
margin: 20px 0;
}
.search-box input {
width: 85%;
max-width: 500px;
padding: 14px 20px;
border-radius: 30px;
border: 1px solid #444;
background-color: #222;
color: white;
font-size: 1rem;
outline: none;
text-align: center;
transition: border 0.3s;
}
.search-box input:focus {
border: 1px solid #E50914;
}
.tabs-container {
display: flex;
justify-content: center;
gap: 10px;
margin: 20px 0;
flex-wrap: wrap;
}
.tab-btn {
background-color: #222;
color: white;
border: 1px solid #333;
padding: 10px 20px;
border-radius: 20px;
cursor: pointer;
font-weight: bold;
font-size: 0.9rem;
transition: all 0.3s;
}
.tab-btn.active, .tab-btn:hover {
background-color: #E50914;
border-color: #E50914;
}
.player-container {
max-width: 900px;
margin: 20px auto;
background: #000;
padding: 15px;
border-radius: 8px;
display: none;
box-shadow: 0px 4px 20px rgba(229, 9, 20, 0.4);
}
iframe {
width: 100%;
height: 450px;
border: none;
border-radius: 4px;
}
@media (max-width: 600px) {
iframe { height: 250px; }
}
.active-title {
margin-top: 12px;
font-size: 1.3rem;
font-weight: bold;
text-align: center;
color: #E50914;
}
.episode-selector {
margin-top: 15px;
display: flex;
gap: 15px;
justify-content: center;
background: #222;
padding: 10px;
border-radius: 6px;
}
.episode-selector label {
font-weight: bold;
font-size: 0.9rem;
align-self: center;
}
.episode-selector select {
background: #000;
color: white;
border: 1px solid #444;
padding: 5px 10px;
border-radius: 4px;
outline: none;
}
.movie-section {
max-width: 1200px;
margin: 40px auto;
}
.section-title {
font-size: 1.6rem;
font-weight: bold;
margin-bottom: 20px;
border-left: 5px solid #E50914;
padding-left: 12px;
text-transform: uppercase;
letter-spacing: 1px;
}
.movie-grid {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
gap: 20px;
}
.movie-card {
background-color: #1f1f1f;
border-radius: 8px;
overflow: hidden;
cursor: pointer;
transition: transform 0.3s, box-shadow 0.3s;
box-shadow: 0 4px 6px rgba(0,0,0,0.3);
}
.movie-card:hover {
transform: scale(1.08);
box-shadow: 0 8px 15px rgba(229,9,20,0.3);
}
.poster-img {
width: 100%;
height: 210px;
object-fit: cover;
border-bottom: 3px solid #E50914;
}
.title-box {
padding: 10px;
font-size: 0.85rem;
text-align: center;
font-weight: bold;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}
</style>
</head>
<body>

<div class="header">
<h1 class="logo">JAILEEFLIX</h1>
<div class="tagline">🍿 Movies, Cinema, KDrama, & Anime • Auto-Update Unlimited</div>
</div>

<div class="search-box">
<input type="text" id="searchInput" placeholder="Mag-search ng Pelikula, KDrama, o Anime...">
</div>

<div class="tabs-container">
<button class="tab-btn active" onclick="switchTab('trending')">🔥 Trending Movies</button>
<button class="tab-btn" onclick="switchTab('cinema')">🎬 Nasa Sinehan Ngayon</button>
<button class="tab-btn" onclick="switchTab('kdama')">🇰🇷 KDrama Series</button>
<button class="tab-btn" onclick="switchTab('anime')">🇯🇵 Anime Series</button>
</div>

<div class="player-container" id="playerContainer">
<iframe id="mainPlayer" allowfullscreen src=""></iframe>
<div class="active-title" id="activeTitle">Pelikula</div>

<div class="episode-selector" id="episodeSelector" style="display: none;">
<div>
<label>Season: </label>
<select id="seasonSelect" onchange="changeSeason()"></select>
</div>
<div>
<label>Episode: </label>
<select id="episodeSelect" onchange="changeEpisode()"></select>
</div>
</div>
</div>

<div class="movie-section">
<div class="section-title" id="mainSectionTitle">Trending Ngayong Araw</div>
<div class="movie-grid" id="movieGrid"></div>
</div>

<script>
const API_KEY = "841804a6012658a98980af866b1a201b";
const BASE_URL = "https://themoviedb.org"; 
const IMG_URL = "https://tmdb.org"; 
const STREAM_URL = "https://vidsrc.sh";

let currentTab = 'trending';
let currentActiveId = '';
let currentActiveType = 'movie';
let globalSeasonsData = []; 

document.addEventListener("DOMContentLoaded", () => {
    loadTabContent();
});

function switchTab(tabName) {
    currentTab = tabName;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    if(event && event.target) {
        event.target.classList.add('active');
    }
    document.getElementById('searchInput').value = '';
    loadTabContent();
}

function loadTabContent() {
    let url = '';
    let title = '';

    if (currentTab === 'trending') {
        url = `${BASE_URL}/trending/movie/day?api_key=${API_KEY}`;
        title = "Trending Ngayong Araw";
    } else if (currentTab === 'cinema') {
        url = `${BASE_URL}/movie/now_playing?api_key=${API_KEY}&region=PH`;
        title = "Nasa mga Sinehan Ngayon";
    } else if (currentTab === 'kdama') {
        url = `${BASE_URL}/discover/tv?api_key=${API_KEY}&with_original_language=ko&sort_by=popularity.desc`;
        title = "Mga Patok na KDrama Series";
    } else if (currentTab === 'anime') {
        url = `${BASE_URL}/discover/tv?api_key=${API_KEY}&with_genres=16&with_original_language=ja&sort_by=popularity.desc`;
        title = "Anime Series Library";
    }

    document.getElementById('mainSectionTitle').innerText = title;
    getMedia(url, (currentTab === 'trending' || currentTab === 'cinema') ? 'movie' : 'tv');
}

document.getElementById('searchInput').addEventListener('keyup', (e) => {
    const query = e.target.value.trim();
    if(query) {
        document.getElementById('mainSectionTitle').innerText = `Resulta para sa: "${query}"`;
        getMedia(`${BASE_URL}/search/multi?api_key=${API_KEY}&query=${query}`, 'multi');
    } else {
        loadTabContent();
    }
});

function getMedia(url, type) {
    fetch(url)
        .then(res => res.json())
        .then(data => {
            if(data.results && data.results.length > 0) {
                showMedia(data.results, type);
            } else {
                document.getElementById('movieGrid').innerHTML = "<p style='grid-column: 1/-1; text-align:center; color:#aaa;'>Walang nahanap. Subukan ang ibang pamagat.</p>";
            }
        })
        .catch(err => console.error("Error fetching data:", err));
}

function showMedia(items, globalType) {
    const grid = document.getElementById('movieGrid');
    grid.innerHTML = '';

    items.forEach(item => {
        if(!item.poster_path) return;

        let mediaType = globalType === 'multi' ? item.media_type : globalType;
        if (mediaType !== 'movie' && mediaType !== 'tv') return;

        const name = item.title || item.name;
        const card = document.createElement('div');
        card.classList.add('movie-card');

        card.onclick = () => playMedia(item.id, mediaType, name);

        card.innerHTML = `
            <img src="${IMG_URL}${item.poster_path}" class="poster-img" alt="${name}">
            <div class="title-box">${name}</div>
        `;
        grid.appendChild(card);
    });
}

function playMedia(id, type, title) {
    currentActiveId = id;
    currentActiveType = type;

    const playerContainer = document.getElementById('playerContainer');
    const mainPlayer = document.getElementById('mainPlayer');
    const activeTitle = document.getElementById('activeTitle');
    const episodeSelector = document.getElementById('episodeSelector');

    activeTitle.innerText = title;
    playerContainer.style.display = 'block';
    playerContainer.scrollIntoView({ behavior: 'smooth' });

    if (type === 'movie') {
        episodeSelector.style.display = 'none';
        mainPlayer.src = `${STREAM_URL}/movie/${id}`;
    } else {
        episodeSelector.style.display = 'flex';

        fetch(`${BASE_URL}/tv/${id}?api_key=${API_KEY}`)
            .then(res => res.json())
            .then(data => {
                globalSeasonsData = data.seasons || [];
                const seasonSelect = document.getElementById('seasonSelect');
                seasonSelect.innerHTML = '';

                globalSeasonsData.forEach(season => {
                    if(season.season_number === 0) return; 
                    const opt = document.createElement('option');
                    opt.value = season.season_number;
                    opt.innerText = `Season ${season.season_number}`;
                    seasonSelect.appendChild(opt);
                });

                updateEpisodes();
            })
            .catch(err => console.error("Error fetching details:", err));
    }
}

function changeSeason() {
    updateEpisodes();
}

function updateEpisodes() {
    const seasonSelect = document.getElementById('seasonSelect');
    const episodeSelect = document.getElementById('episodeSelect');
    const activeSeasonNum = parseInt(seasonSelect.value) || 1;

    const currentSeason = globalSeasonsData.find(s => s.season_number === activeSeasonNum);
    episodeSelect.innerHTML = '';

    if (currentSeason) {
        for (let i = 1; i <= currentSeason.episode_count; i++) {
            const opt = document.createElement('option');
            opt.value = i;
            opt.innerText = `Episode ${i}`;
            episodeSelect.appendChild(opt);
        }
    }
    changeEpisode();
}

function changeEpisode() {
    const mainPlayer = document.getElementById('mainPlayer');
    const season = document.getElementById('seasonSelect').value || 1;
    const episode = document.getElementById('episodeSelect').value || 1;
